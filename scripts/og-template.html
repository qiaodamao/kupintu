<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>酷拼图 OG</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC",
          "Noto Sans CJK SC", system-ui, sans-serif;
        background: #ffffff;
        color: #0f172a;
        position: relative;
      }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(70% 60% at 12% 0%, rgba(99,102,241,0.18), transparent 60%),
          radial-gradient(60% 55% at 92% 8%, rgba(217,70,239,0.16), transparent 60%),
          radial-gradient(70% 70% at 60% 110%, rgba(56,189,248,0.14), transparent 60%),
          #ffffff;
      }
      .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand-name { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
      .brand-tag {
        margin-left: 6px; font-size: 16px; font-weight: 500; color: #4f46e5;
        background: rgba(99,102,241,0.10); border: 1px solid rgba(99,102,241,0.22);
        padding: 6px 12px; border-radius: 999px;
      }
      .middle { flex: 1; display: flex; align-items: center; gap: 56px; }
      .left { flex: 1; }
      h1 { font-size: 66px; line-height: 1.18; font-weight: 800; letter-spacing: -1.5px; }
      .grad {
        background: linear-gradient(93deg, #6366f1, #d946ef 70%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub { margin-top: 26px; font-size: 25px; line-height: 1.7; color: #475569; font-weight: 500; }
      .chips { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
      .chip {
        font-size: 18px; font-weight: 600; color: #334155;
        background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; padding: 9px 16px;
      }
      .grid {
        width: 380px; height: 380px; flex: none;
        display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
        gap: 12px; padding: 16px; border-radius: 28px;
        background: #ffffff; box-shadow: 0 30px 60px -20px rgba(15,23,42,0.22);
        border: 1px solid rgba(148,163,184,0.28);
      }
      .g1 { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg,#818cf8,#7c3aed); }
      .g2 { grid-column: span 2; background: linear-gradient(135deg,#7dd3fc,#22d3ee); }
      .g3 { background: linear-gradient(135deg,#fcd34d,#fb923c); }
      .g4 { background: linear-gradient(135deg,#fda4af,#f472b6); }
      .g5 { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg,#6ee7b7,#14b8a6); }
      .g6 { background: linear-gradient(135deg,#e9d5ff,#c084fc); }
      .g7 { background: linear-gradient(135deg,#cbd5e1,#94a3b8); }
      .g8 { grid-column: span 2; background: linear-gradient(135deg,#bef264,#4ade80); }
      .cell { border-radius: 12px; }
      .foot { display: flex; align-items: center; justify-content: space-between; }
      .url { font-size: 24px; font-weight: 700; color: #4f46e5; letter-spacing: 0.2px; }
      .note { font-size: 19px; color: #64748b; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="wrap">
      <div class="brand">
        <svg width="44" height="44" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset="1" stop-color="#d946ef" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#g)" />
          <rect x="6.5" y="6.5" width="8" height="8" rx="2" fill="#fff" opacity="0.95" />
          <rect x="17.5" y="6.5" width="8" height="8" rx="2" fill="#fff" opacity="0.7" />
          <rect x="6.5" y="17.5" width="8" height="8" rx="2" fill="#fff" opacity="0.7" />
          <rect x="17.5" y="17.5" width="8" height="8" rx="2" fill="#fff" opacity="0.95" />
        </svg>
        <span class="brand-name">酷拼图</span>
        <span class="brand-tag">免费 · 无水印 · 无需登录</span>
      </div>

      <div class="middle">
        <div class="left">
          <h1>免费在线<span class="grad">拼图</span><br />与长图拼接工具</h1>
          <p class="sub">拖拽即换布局，滚轮缩放构图，标注随手写。</p>
          <div class="chips">
            <span class="chip">1~16 张网格模板</span>
            <span class="chip">长图拼接</span>
            <span class="chip">文字箭头标注</span>
            <span class="chip">4K 无水印导出</span>
          </div>
        </div>
        <div class="grid">
          <div class="cell g1"></div>
          <div class="cell g2"></div>
          <div class="cell g3"></div>
          <div class="cell g4"></div>
          <div class="cell g5"></div>
          <div class="cell g6"></div>
          <div class="cell g7"></div>
          <div class="cell g8"></div>
        </div>
      </div>

      <div class="foot">
        <span class="url">pintu.kusheji.com</span>
        <span class="note">图片不上传服务器 · 纯浏览器本地处理</span>
      </div>
    </div>
  </body>
</html>
